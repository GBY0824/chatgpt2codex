name: GOAL app auth review

on:
  pull_request:
    branches: [main]
    paths:
      - "src/server/goal-app-intent.ts"
      - "src/server/goal-app-intent.test.ts"
      - "src/server/http.ts"
      - "src/server/tools.ts"
      - "src/server/tools-catalog.test.ts"
      - "src/server/mcp-remote-control.test.ts"
      - "src/cli.ts"
      - "src/state/isolated-state.ts"
      - "src/state/isolated-state.test.ts"
      - "scripts/Prepare-GoalAppOfflineStage.ps1"
      - "scripts/goal_app_local_oauth_smoke_20261101.mjs"
      - "scripts/verify-legacy-mcp-compat.mjs"
      - "scripts/verify-synthetic-windows-cutover.mjs"
      - "scripts/verify-synthetic-windows-crash-recovery.mjs"
      - "docs/GOAL_APP_AUTH_REVIEW.md"
      - "docs/MCP_SINGLE_RUNTIME_MIGRATION.md"
      - ".github/workflows/goal-app-auth-review.yml"

permissions:
  contents: read

jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Full TypeScript typecheck
        run: npm run typecheck
      - name: GOAL intent and MCP tool catalog regressions
        run: npx vitest run src/server/goal-app-intent.test.ts src/server/tools-catalog.test.ts src/server/mcp-remote-control.test.ts src/state/isolated-state.test.ts
      - name: Full source build (no deployment)
        run: npm run build
      # Verify the candidate source is an additive upgrade of the ACTUAL
      # checked-out baseline main; do not trust a hand-maintained tool list.
      - name: Checkout current legacy main for compatibility contract
        uses: actions/checkout@v4
        with:
          ref: main
          path: legacy-base
          persist-credentials: false
      - name: Build legacy main in CI sandbox
        working-directory: legacy-base
        run: |
          npm ci
          npm run build
      - name: Compare built MCP tool and OAuth compatibility with baseline
        run: node scripts/verify-legacy-mcp-compat.mjs legacy-base .

  macos-control-regressions:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Existing full suite on native macOS
        run: npm test

  windows-source-regressions:
    # Isolated hosted Windows runner; no access to the user's installed
    # ChatGPT To Codex, OAuth credentials, Tailscale, Chrome or research state.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify OpenSSL available for loopback TLS regression
        shell: pwsh
        run: |
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) {
            $candidate = "C:\Program Files\Git\usr\bin\openssl.exe"
            if (-not (Test-Path $candidate)) { throw "OpenSSL not available on runner" }
            Split-Path $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Windows GOAL OAuth and local HTTPS regressions
        run: npx vitest run src/server/goal-app-intent.test.ts src/server/tools-catalog.test.ts src/server/mcp-remote-control.test.ts src/state/isolated-state.test.ts
      # Does not read, stop, or overwrite the owner's installed MCP. All test
      # paths are generated under the disposable Windows runner temp root.
      - name: Synthetic Windows single-MCP cutover and rollback injections
        run: node scripts/verify-synthetic-windows-cutover.mjs
      - name: Synthetic Windows process-crash journal recovery and corrupt-state fences
        run: node scripts/verify-synthetic-windows-crash-recovery.mjs
      - name: Windows TypeScript typecheck
        run: npm run typecheck
      - name: Windows source build only
        run: npm run build
      - name: Windows CLI isolated-state nonproduction smoke
        shell: pwsh
        run: |
          @'
          const { spawnSync } = require("node:child_process");
          const path = require("node:path");
          const fs = require("node:fs");
          const isolated = path.join(process.env.RUNNER_TEMP, "goal-cli-isolated-state");
          const run = (...args) => spawnSync(process.execPath, ["dist/cli.js", ...args], {
            encoding: "utf8", timeout: 10000, windowsHide: true,
          });
          const status = run("owner-token", "--status", "--isolated-state-dir", isolated);
          if (status.status !== 0) throw new Error("isolated status failed: " + status.stderr);
          const parsed = JSON.parse(status.stdout);
          if (parsed.configured !== false) throw new Error("Inherited owner token");
          const isolatedArgs = ["serve", "--http", "--workspace", process.cwd(),
            "--isolated-state-dir", isolated, "--host", "127.0.0.1",
            "--port", "7987", "--public-url", "http://127.0.0.1:7987"];
          // The existing app's desktop-control flag defaults to ON even if
          // CHATGPT2CODEX_CONTROL is absent: this MUST be diagnosed accurately.
          const controlOn = run(...isolatedArgs);
          if (controlOn.status === 0 || !controlOn.stderr.includes(
              "ISOLATED_STAGE_DESKTOP_CONTROL_MUST_BE_DISABLED")) {
            throw new Error("Default-on desktop control gate missed: " + controlOn.stderr);
          }
          if (fs.existsSync(isolated)) {
            throw new Error("Denied desktop-control operation created state");
          }
          // Explicitly OFF for this test process only. A valid localhost port
          // must pass the staging gate, then fail closed because no owner
          // token was generated. Never launch a real service in this smoke.
          const offEnv = { ...process.env, CHATGPT2CODEX_CONTROL: "0" };
          const safe = spawnSync(process.execPath, ["dist/cli.js", ...isolatedArgs], {
            encoding: "utf8", timeout: 10000, windowsHide: true, env: offEnv,
          });
          if (safe.status !== 1 ||
              !safe.stderr.includes("no owner token found") ||
              safe.stderr.includes("ISOLATED_STAGE_LOOPBACK")) {
            throw new Error("Valid staging arguments were wrongly blocked: " + safe.stderr);
          }
          // With control explicitly OFF, the production port must still be
          // rejected before any server is started.
          const deniedArgs = [...isolatedArgs];
          deniedArgs[deniedArgs.indexOf("7987")] = "7979";
          deniedArgs[deniedArgs.indexOf("http://127.0.0.1:7987")] = "http://127.0.0.1:7979";
          const blocked = spawnSync(process.execPath, ["dist/cli.js", ...deniedArgs], {
            encoding: "utf8", timeout: 10000, windowsHide: true, env: offEnv,
          });
          if (blocked.status === 0 ||
              !blocked.stderr.includes("ISOLATED_STAGE_LOOPBACK_NONPRODUCTION_PORT_REQUIRED")) {
            throw new Error("Production-port refusal missing: " + blocked.stderr);
          }
          // The successful guard pass can legitimately create a separate,
          // empty staging state before refusing the missing owner token.
          if (!fs.existsSync(isolated)) {
            throw new Error("Valid isolated execution never reached state initialization");
          }
          console.log("ISOLATED_STATE_CLI_FAIL_CLOSED_PASS");
          '@ | node -
          if ($LASTEXITCODE -ne 0) { throw "Windows isolated CLI smoke failed" }
      - name: Package isolated Windows staging bundle (no deployment)
        shell: pwsh
        run: |
          npm prune --omit=dev --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "Production dependency pruning failed" }
          New-Item -ItemType Directory -Path staging-release -Force | Out-Null
          Copy-Item -Path dist -Destination staging-release\dist -Recurse
          Copy-Item -Path node_modules -Destination staging-release\node_modules -Recurse
          Copy-Item -Path package.json -Destination staging-release\package.json
          Copy-Item -Path package-lock.json -Destination staging-release\package-lock.json
          Copy-Item -Path scripts\Prepare-GoalAppOfflineStage.ps1 -Destination staging-release\Prepare-GoalAppOfflineStage.ps1
          @'
          GOAL APP WINDOWS ISOLATED SOURCE BUNDLE
          NO CREDENTIALS. NO OWNER TOKEN. NO INSTALLED SERVICE.
          This is a review-only Node 22+ build generated in a disposable
          GitHub-hosted Windows runner, NOT an update to the user PC.
          Use --isolated-state-dir ABSOLUTE_PATH on every CLI invocation.
          Isolated serve requires explicit non-7979 port, loopback host and
          loopback HTTP public origin; desktop control is disabled.
          Do not reuse the default/production owner state, port or Funnel.
          A separate, owner-approved HTTPS deployment is NOT included.
          chatgpt2codex.goal records APP INTENT ONLY; no P3 authorization,
          research dispatch or consumer ChatGPT rollover is granted.
          '@ | Set-Content -Path staging-release\STAGING_README.txt -Encoding UTF8
          # Version 0.2.0 is shared with the installed legacy app; pin actual source.
          $sourceHead = "${{ github.event.pull_request.head.sha }}"
          $mergeCheckout = "${{ github.sha }}"
          if ($sourceHead -notmatch '^[0-9a-f]{40}$' -or
              $mergeCheckout -notmatch '^[0-9a-f]{40}$') {
            throw "Missing unambiguous review source provenance"
          }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          @(
            "reviewOnly=true"
            "sourcePrHeadSha=$sourceHead"
            "ciCheckoutSha=$mergeCheckout"
            "legacySharedPackageVersion=$packageVersion"
            "nodeVersion=$(node --version)"
            "productionDeploymentApproved=false"
          ) | Set-Content -Path staging-release\STAGING_PROVENANCE.txt -Encoding ascii
          $root = (Resolve-Path staging-release).Path
          $entries = Get-ChildItem staging-release -Recurse -File | Sort-Object FullName
          $lines = foreach ($file in $entries) {
            $relative = $file.FullName.Substring($root.Length + 1).Replace('\', '/')
            $sha = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$sha  $relative"
          }
          $lines | Set-Content -Path staging-release\SHA256SUMS.txt -Encoding ascii
          if (-not (Test-Path staging-release\dist\cli.js)) { throw "Missing CLI entrypoint" }
      - name: Verify offline stage preparation and tamper rejection
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "goal-app-offline-stage"
          $receipt = & ./scripts/Prepare-GoalAppOfflineStage.ps1 -BundleRoot "staging-release" -DestinationRoot $destination
          $state = $receipt | ConvertFrom-Json
          if ($state.code -ne "STAGE_OFFLINE_PREPARED_ONLY" -or
              $state.checksumVerified -ne $true -or
              $state.serviceStarted -ne $false) {
            throw "Offline bundle stage verification did not stay inactive"
          }
          if (!(Test-Path (Join-Path $destination "dist/cli.js"))) { throw "Stage executable missing" }
          $prov = Get-Content (Join-Path $destination "STAGING_PROVENANCE.txt") -Raw
          if ($prov -notmatch '(?m)^reviewOnly=true\r?$' -or
              $prov -notmatch "(?m)^sourcePrHeadSha=${{ github.event.pull_request.head.sha }}\r?$" -or
              $prov -notmatch "(?m)^ciCheckoutSha=${{ github.sha }}\r?$" -or
              $prov -notmatch '(?m)^productionDeploymentApproved=false\r?$') {
            throw "Staging provenance receipt missing or inconsistent"
          }
          $tampered = Join-Path $env:RUNNER_TEMP "goal-app-bundle-tampered"
          Copy-Item -Path staging-release -Destination $tampered -Recurse
          Add-Content -LiteralPath (Join-Path $tampered "STAGING_README.txt") -Value "tamper-negative-test"
          try {
            & ./scripts/Prepare-GoalAppOfflineStage.ps1 -BundleRoot $tampered -DestinationRoot (Join-Path $env:RUNNER_TEMP "denied-tampered-stage")
            throw "Tampered bundle was incorrectly accepted"
          } catch {
            if ($_.Exception.Message -notmatch "STAGE_SHA256_MISMATCH") { throw }
          }
      - name: Upload isolated Windows bundle (not installed)
        uses: actions/upload-artifact@v4
        with:
          name: goal-app-windows-source-${{ github.sha }}
          path: staging-release/
          retention-days: 7
          # SHA256SUMS lists dot-files/dirs (e.g. node_modules/.bin).
          # upload-artifact@v4.4+ drops these by default, causing an
          # unrecoverable missing-file error after the owner extracts the ZIP.
          # Only staged source assets are in this upload; no credentials.
          include-hidden-files: true
          if-no-files-found: error
      - name: Download the published archive for round-trip validation
        uses: actions/download-artifact@v4
        with:
          name: goal-app-windows-source-${{ github.sha }}
          path: staging-artifact-download
      - name: Verify downloaded artifact hashes and offline stage replay
        shell: pwsh
        run: |
          $downloaded = (Resolve-Path staging-artifact-download).Path
          $manifest = Join-Path $downloaded "SHA256SUMS.txt"
          if (!(Test-Path $manifest)) { throw "Downloaded SHA256 manifest missing" }
          $expectedCount = @(Get-Content $manifest).Count
          $artifactCount = @(Get-ChildItem -LiteralPath $downloaded -Recurse -File -Force).Count
          if ($artifactCount -ne ($expectedCount + 1)) {
            throw "Artifact roundtrip file count mismatch: manifest=$expectedCount archive=$artifactCount"
          }
          $roundtripDestination = Join-Path $env:RUNNER_TEMP "goal-app-downloaded-artifact-stage"
          $receipt = & ./scripts/Prepare-GoalAppOfflineStage.ps1 -BundleRoot $downloaded -DestinationRoot $roundtripDestination
          $state = $receipt | ConvertFrom-Json
          if ($state.code -ne "STAGE_OFFLINE_PREPARED_ONLY" -or
              $state.checksumVerified -ne $true -or $state.serviceStarted -ne $false) {
            throw "Downloaded archive failed its own SHA256 offline stage replay"
          }
          Write-Host "DOWNLOADED_ARTIFACT_SHA256_VERIFIED files=$expectedCount"
