name: GOAL app auth review

on:
  pull_request:
    branches: [main]
    paths:
      - "src/server/goal-app-intent.ts"
      - "src/server/goal-app-intent.test.ts"
      - "src/server/http.ts"
      - "src/server/tools.ts"
      - "src/server/tools-catalog.test.ts"
      - "src/server/mcp-remote-control.test.ts"
      - "src/cli.ts"
      - "src/state/isolated-state.ts"
      - "src/state/isolated-state.test.ts"
      - ".github/workflows/goal-app-auth-review.yml"

permissions:
  contents: read

jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Full TypeScript typecheck
        run: npm run typecheck
      - name: GOAL intent and MCP tool catalog regressions
        run: npx vitest run src/server/goal-app-intent.test.ts src/server/tools-catalog.test.ts src/server/mcp-remote-control.test.ts src/state/isolated-state.test.ts
      - name: Full source build (no deployment)
        run: npm run build

  macos-control-regressions:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Existing full suite on native macOS
        run: npm test

  windows-source-regressions:
    # Isolated hosted Windows runner; no access to the user's installed
    # ChatGPT To Codex, OAuth credentials, Tailscale, Chrome or research state.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify OpenSSL available for loopback TLS regression
        shell: pwsh
        run: |
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) {
            $candidate = "C:\Program Files\Git\usr\bin\openssl.exe"
            if (-not (Test-Path $candidate)) { throw "OpenSSL not available on runner" }
            Split-Path $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Windows GOAL OAuth and local HTTPS regressions
        run: npx vitest run src/server/goal-app-intent.test.ts src/server/tools-catalog.test.ts src/server/mcp-remote-control.test.ts src/state/isolated-state.test.ts
      - name: Windows TypeScript typecheck
        run: npm run typecheck
      - name: Windows source build only
        run: npm run build
      - name: Windows CLI isolated-state nonproduction smoke
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP "goal-cli-isolated-state"
          $result = & node dist/cli.js owner-token --status --isolated-state-dir $isolated
          if ($LASTEXITCODE -ne 0) { throw "Isolated status failed" }
          $parsed = $result | ConvertFrom-Json
          if ($parsed.configured -ne $false) { throw "Unexpected inherited owner token" }
          $blocked = & node dist/cli.js serve --http --isolated-state-dir $isolated --port 7979 2>&1
          if ($LASTEXITCODE -eq 0 -or -not (($blocked -join " ") -match "ISOLATED_STAGE_LOOPBACK_NONPRODUCTION_PORT_REQUIRED")) {
            throw "Isolated mode did not reject production port"
          }
          if (Test-Path $isolated) { throw "Blocked operation wrote to isolated state" }
      - name: Package isolated Windows staging bundle (no deployment)
        shell: pwsh
        run: |
          npm prune --omit=dev --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "Production dependency pruning failed" }
          New-Item -ItemType Directory -Path staging-release -Force | Out-Null
          Copy-Item -Path dist -Destination staging-release\dist -Recurse
          Copy-Item -Path node_modules -Destination staging-release\node_modules -Recurse
          Copy-Item -Path package.json -Destination staging-release\package.json
          Copy-Item -Path package-lock.json -Destination staging-release\package-lock.json
          @'
          GOAL APP WINDOWS ISOLATED SOURCE BUNDLE
          NO CREDENTIALS. NO OWNER TOKEN. NO INSTALLED SERVICE.
          This is a review-only Node 22+ build generated in a disposable
          GitHub-hosted Windows runner, NOT an update to the user PC.
          Use --isolated-state-dir ABSOLUTE_PATH on every CLI invocation.
          Isolated serve requires explicit non-7979 port, loopback host and
          loopback HTTP public origin; desktop control is disabled.
          Do not reuse the default/production owner state, port or Funnel.
          A separate, owner-approved HTTPS deployment is NOT included.
          chatgpt2codex.goal records APP INTENT ONLY; no P3 authorization,
          research dispatch or consumer ChatGPT rollover is granted.
          '@ | Set-Content -Path staging-release\STAGING_README.txt -Encoding UTF8
          $root = (Resolve-Path staging-release).Path
          $entries = Get-ChildItem staging-release -Recurse -File | Sort-Object FullName
          $lines = foreach ($file in $entries) {
            $relative = $file.FullName.Substring($root.Length + 1).Replace('\', '/')
            $sha = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$sha  $relative"
          }
          $lines | Set-Content -Path staging-release\SHA256SUMS.txt -Encoding ascii
          if (-not (Test-Path staging-release\dist\cli.js)) { throw "Missing CLI entrypoint" }
      - name: Upload isolated Windows bundle (not installed)
        uses: actions/upload-artifact@v4
        with:
          name: goal-app-windows-source-${{ github.sha }}
          path: staging-release/
          retention-days: 7
          if-no-files-found: error
