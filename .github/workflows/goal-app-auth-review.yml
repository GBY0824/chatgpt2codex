name: GOAL app auth review

on:
  pull_request:
    branches: [main]
    paths:
      - "src/server/goal-app-intent.ts"
      - "src/server/goal-app-intent.test.ts"
      - "src/server/http.ts"
      - "src/server/tools.ts"
      - "src/server/tools-catalog.test.ts"
      - ".github/workflows/goal-app-auth-review.yml"

permissions:
  contents: read

jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Full TypeScript typecheck
        run: npm run typecheck
      - name: GOAL intent and MCP tool catalog regressions
        run: npx vitest run src/server/goal-app-intent.test.ts src/server/tools-catalog.test.ts
      - name: Full source build (no deployment)
        run: npm run build

  macos-control-regressions:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Existing full suite on native macOS
        run: npm test
